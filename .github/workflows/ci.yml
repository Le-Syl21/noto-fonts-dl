name: CI

# Aucun build sur push `main` : le travail arrive en direct sur main. Les gates
# tournent sur PR, sur tag (avant toute publication) et à la demande.
on:
  pull_request:
  push:
    tags: ['v*']          # attrape v1.2.3 ET les pré-releases v1.2.3-rc1
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1

      - name: rustfmt
        run: cargo fmt --all --check

      # Volontairement sans --all-features : chaque feature de langue déclenche
      # le téléchargement d'un jeu de polices Google dans build.rs. Les activer
      # toutes ferait un CI long et dépendant d'un service tiers pour rien.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      # Un tag qui ne correspond pas à Cargo.toml produirait une release
      # silencieusement non publiée : cargo répond « already exists » et le run
      # reste vert. On échoue explicitement à la place.
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"   # ignore le suffixe pré-release (-rc/-beta)
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag ne correspond pas à la version Cargo.toml $crate"
            exit 1
          fi
          echo "Publication de la version $crate"

      - name: cargo publish --dry-run
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --dry-run

  github-release:
    name: GitHub release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # Les tags pré-release (v1.2.3-rc1, -beta…) sont marqués « pre-release ».
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-crate:
    name: Publish to crates.io
    # La publication crates.io est le seul geste irréversible (« yank » ne
    # supprime rien) : elle passe donc APRÈS la release GitHub, révocable.
    needs: [verify, github-release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write        # nécessaire pour demander le jeton OIDC à GitHub
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      # Trusted Publishing : aucun secret longue durée. GitHub atteste l'identité
      # du workflow (repo + fichier + environnement), crates.io vérifie cette
      # attestation et émet un jeton éphémère, révoqué en fin de job.
      - name: Get a temporary crates.io token (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
