[package]
name = "noto-fonts-dl"
version = "0.1.5"
edition = "2021"
description = "Download and embed Google Noto fonts at build time with Cargo feature flags. 134 languages/scripts supported. Fonts compressed with XZ, decompressed at runtime."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Le-Syl21/noto-fonts-dl"
keywords = ["font", "noto", "i18n", "egui", "unicode"]
categories = ["gui", "internationalization", "text-processing"]

[features]
default = []
# Common languages
ar = []       # Arabic
bn = []       # Bengali
hi = []       # Hindi (Devanagari)
ja = []       # Japanese (CJK)
ko = []       # Korean (CJK)
zh = []       # Chinese Simplified (CJK)
zh_tw = []    # Chinese Traditional (CJK)
he = []       # Hebrew
th = []       # Thai
ka = []       # Georgian
hy = []       # Armenian
am = []       # Amharic (Ethiopic)
ta = []       # Tamil
te = []       # Telugu
kn = []       # Kannada
ml = []       # Malayalam
gu = []       # Gujarati
pa = []       # Punjabi (Gurmukhi)
or = []       # Odia (Oriya)
si = []       # Sinhala
km = []       # Khmer
my = []       # Myanmar
lo = []       # Lao
bo = []       # Tibetan
ur = []       # Urdu (Nastaliq)
vi = []       # Vietnamese (Latin Extended Additional — tone marks)
dv = []       # Dhivehi (Thaana)
chr = []      # Cherokee
mn = []       # Mongolian
# Historical and rare scripts
adlm = []     # Adlam
aghb = []     # Caucasian Albanian
ahom = []     # Ahom
armi = []     # Imperial Aramaic
avst = []     # Avestan
bali = []     # Balinese
