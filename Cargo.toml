# Convenience groups
all-common = ["ar", "bn", "hi", "ja", "ko", "zh", "zh_tw", "he", "th"]
all-indic = ["hi", "bn", "ta", "te", "kn", "ml", "gu", "pa", "or", "si"]
all-cjk = ["ja", "ko", "zh", "zh_tw"]

[dependencies]
xz2 = "0.1"

[build-dependencies]
xz2 = "0.1"
ureq = "2"
serde_json = "1"

[dev-dependencies]
eframe = "0.31"
egui = "0.31"
